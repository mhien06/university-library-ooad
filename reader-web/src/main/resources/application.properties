server.port=${WEB_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:university_library}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:library_app}
spring.datasource.password=${DB_PASSWORD:change-this-app-password}
spring.datasource.hikari.maximum-pool-size=8
spring.thymeleaf.cache=false
library.storage-directory=${LIBRARY_STORAGE:../library-storage}
