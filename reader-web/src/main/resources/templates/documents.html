<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tài liệu điện tử · Thư viện Đại học</title><link rel="stylesheet" href="/css/library.css"></head><body><header class="topbar"><a class="brand" href="/">Thư viện <span>Đại học</span></a><nav><a href="/catalog">Tra cứu sách</a><a href="/cards">Thẻ thư viện</a><a href="/reservations">Đặt trước</a><a href="/loans">Mượn–trả</a><a href="/violations">Vi phạm</a><a class="active" href="/documents">Tài liệu điện tử</a><a href="/account">Tài khoản</a><form method="post" action="/logout"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="link-button">Đăng xuất</button></form></nav></header><main class="page-shell"><p class="eyebrow">ĐỌC TRỰC TUYẾN</p><h1>Tài liệu điện tử</h1><p class="muted">Không cần thẻ thư viện. Chỉ cần đăng nhập tài khoản độc giả.</p><form class="search-bar" method="get" action="/documents"><input name="q" th:value="${q}" placeholder="Tiêu đề, tác giả hoặc danh mục" required><button class="button primary">Tìm tài liệu</button></form><div class="empty-state" th:if="${#lists.isEmpty(documents)}" th:text="${needsSearch ? 'Nhập từ khóa để tìm tài liệu.' : 'Chưa tìm thấy tài liệu phù hợp.'}">Nhập từ khóa để tìm tài liệu.</div><div class="document-grid"><article class="document-card" th:each="d:${documents}"><div class="doc-icon">PDF</div><div><p class="eyebrow" th:text="${d.category_label != null ? d.category_label : 'TÀI LIỆU'}"></p><h2 th:text="${d.title}"></h2><p class="muted" th:text="${d.author_label != null ? d.author_label : 'Thư viện Đại học'}"></p><p th:text="${d.description}"></p><a class="text-link" th:href="@{/documents/{id}/read(id=${d.document_id})}" target="_blank" rel="noopener">Đọc tài liệu <span>↗</span></a></div></article></div></main><footer><span>THƯ VIỆN ĐẠI HỌC</span><a href="/catalog">Tìm sách in</a></footer></body></html>
