<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tạo tài khoản · Thư viện Đại học</title><link rel="stylesheet" href="/css/library.css"></head><body>
<header class="topbar"><a class="brand" href="/">Thư viện <span>Đại học</span></a><nav><a href="/">Trang chủ</a><a class="nav-cta" href="/login">Đăng nhập</a></nav></header>
<main class="auth-layout"><section class="auth-aside"><p class="eyebrow">DÀNH CHO THÀNH VIÊN TRƯỜNG</p><h1>Mở cánh cửa<br><em>đến tri thức.</em></h1><p>Đăng ký bằng mã thành viên và email đang lưu trong hồ sơ trường. Tài khoản độc giả được liên kết tự động.</p></section><section class="auth-card"><p class="eyebrow">TẠO TÀI KHOẢN ĐỘC GIẢ</p><h2>Đăng ký</h2><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" action="/register" class="stack-form"><input type="hidden" name="_csrf" th:value="${csrfToken}"><label>Mã sinh viên / học viên / giảng viên<input name="memberCode" required maxlength="40" autocomplete="off"></label><label>Email trường<input name="email" type="email" required maxlength="190" autocomplete="email"></label><label>Tên đăng nhập<input name="username" required minlength="4" maxlength="50" autocomplete="username"></label><label>Mật khẩu<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Xác nhận mật khẩu<input name="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></label><button class="button primary full">Tạo tài khoản <span>→</span></button></form><p class="form-foot">Đã có tài khoản? <a href="/login">Đăng nhập</a></p></section></main><footer><span>THƯ VIỆN ĐẠI HỌC</span><a href="/">Quay về trang chủ</a></footer></body></html>
