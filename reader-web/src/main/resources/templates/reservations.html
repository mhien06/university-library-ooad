<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đặt trước · Thư viện Đại học</title><link rel="stylesheet" href="/css/library.css"></head>
<body>
<header class="topbar"><a class="brand" href="/">Thư viện <span>Đại học</span></a><nav><a href="/catalog">Tra cứu sách</a><a href="/cards">Thẻ thư viện</a><a class="active" href="/reservations">Đặt trước</a><a href="/loans">Mượn–trả</a><a href="/violations">Vi phạm</a><a href="/documents">Tài liệu điện tử</a><a href="/account">Tài khoản</a><form method="post" action="/logout"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="link-button">Đăng xuất</button></form></nav></header>
<main class="page-shell"><p class="eyebrow">TÀI KHOẢN CỦA BẠN</p><h1>Yêu cầu đặt trước</h1><div class="alert" th:if="${notice}" th:text="${notice}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><div class="empty-state" th:if="${#lists.isEmpty(reservations)}">Bạn chưa gửi yêu cầu đặt trước nào. <a href="/catalog">Tìm sách</a></div>
<div class="table-wrap" th:if="${!#lists.isEmpty(reservations)}"><table><thead><tr><th>Sách</th><th>Ngày gửi</th><th>Trạng thái</th><th>Hạn nhận</th><th>Ghi chú</th><th></th></tr></thead><tbody><tr th:each="r:${reservations}"><td th:text="${r.title}"></td><td th:text="${#temporals.format(r.requested_at.toLocalDateTime(),'dd/MM/yyyy HH:mm')}"></td><td><span class="status" th:text="${r.status_label}"></span></td><td th:text="${r.expires_at != null ? #temporals.format(r.expires_at.toLocalDateTime(),'dd/MM/yyyy HH:mm') : '—'}"></td><td class="note-cell" th:text="${r.note != null ? r.note : '—'}"></td><td><form th:if="${r.reservation_status == 'PENDING' or r.reservation_status == 'APPROVED' or r.reservation_status == 'READY_FOR_PICKUP'}" method="post" th:action="@{/reservations/{id}/cancel(id=${r.reservation_id})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="button small-button secondary">Hủy</button></form></td></tr></tbody></table></div></main>
<footer><span>THƯ VIỆN ĐẠI HỌC</span><a href="/catalog">Tìm sách</a></footer>
</body></html>
