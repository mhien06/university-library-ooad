services:
  database:
    image: mysql:8.4
    container_name: university-library-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
      MYSQL_DATABASE: university_library
      MYSQL_USER: library_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-this-app-password}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - library_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  library_mysql_data:
